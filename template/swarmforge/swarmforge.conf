# Format: window <role> <agent> <worktree> [task|batch] [extra-cli-args...]
# The optional receive mode defaults to task. Use batch for roles that should
# consume all currently queued equal-priority handoffs as one batch.
# Any fields after the receive mode are passed to the agent CLI, e.g. --yolo.
# Supported agents: claude, codex, copilot, grok, hermes, opencode, pi.
# Example OpenCode role:
# window coder opencode coder --model provider/model --agent build --auto
window specifier pi master --model openai-codex/gpt-5.4-mini --thinking medium
window coder pi coder --model openai-codex/gpt-5.4-mini --thinking medium
window reviewer pi reviewer --model openai-codex/gpt-5.6-luna  --thinking medium
window architect pi architect batch --model openai-codex/gpt-5.6-terra --thinking high
