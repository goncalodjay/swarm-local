name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  bash-syntax:
    name: bash -n
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check bash scripts
        run: |
          set -e
          while IFS= read -r script; do
            bash -n "$script"
          done < <(find . -name '*.sh' -not -path './node_modules/*' -not -path './tui/node_modules/*' -print0 | xargs -0)

  macos:
    name: macOS (bash 3.2 + python tests)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap scripts parse under the system bash 3.2
        run: |
          /bin/bash -n install.sh
          /bin/bash -n bin/swarm-kura
          /bin/bash -n swarm-init
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python tests
        run: |
          python -m pip install -q pytest
          python -m pytest -q tests

  python-compile:
    name: py_compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile-check Python sources
        run: |
          python3 -m compileall -q template/swarmforge/scripts || true

  tui-build:
    name: tui build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4'
      - name: Build TUI on linux-x64
        working-directory: tui
        run: |
          bun install
          bun run build
      - name: Upload linux-x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: swarm-tui-linux-x64
          path: tui/dist/swarm-tui
