name: Release TUI binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
            artifact: swarm-tui-linux-x64.bin
          - os: ubuntu-22.04-arm
            label: linux-arm64
            artifact: swarm-tui-linux-arm64.bin
          - os: macos-latest
            label: darwin-arm64
            artifact: swarm-tui-darwin-arm64.bin
          - os: macos-13
            label: darwin-x64
            artifact: swarm-tui-darwin-x64.bin
          - os: windows-latest
            label: windows-x64
            artifact: swarm-tui-windows-x64.bin

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4'

      - name: Install deps
        working-directory: tui
        run: bun install --frozen-lockfile

      - name: Build TUI
        working-directory: tui
        run: bun run build

      - name: Stage binary as <artifact>
        shell: bash
        run: |
          mkdir -p release
          if [[ "${{ matrix.os }}" == windows-* ]]; then
            cp tui/dist/swarm-tui.exe "release/${{ matrix.artifact }}"
          else
            cp tui/dist/swarm-tui "release/${{ matrix.artifact }}"
          fi

      - name: sha256
        shell: bash
        working-directory: release
        run: |
          sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: release/${{ matrix.artifact }}
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Compute sha256 for every binary
        working-directory: dist
        run: |
          for f in *; do
            [[ "$f" == *.sha256 ]] && continue
            sha256sum "$f" > "$f.sha256"
          done

      - name: Read VERSION (from repo root)
        id: version
        run: |
          if [[ -f VERSION ]]; then
            v=$(tr -d '[:space:]' < VERSION)
          else
            v=${GITHUB_REF_NAME#v}
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build manifest.json
        working-directory: dist
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib
          out = {"version": "${{ steps.version.outputs.version }}", "binaries": []}
          for f in sorted(pathlib.Path('.').glob('*')):
              if f.suffix == '.sha256' or f.name == 'manifest.json':
                  continue
              sha = hashlib.sha256(f.read_bytes()).hexdigest()
              out["binaries"].append({
                  "name": f.name,
                  "sha256": sha,
              })
          pathlib.Path('manifest.json').write_text(json.dumps(out, indent=2))
          PY
          cat manifest.json

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*
