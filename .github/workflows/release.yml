name: Release

# Push a tag vX.Y.Z (matching VERSION) to publish a release. Assets:
#   swarm-kura-<os>-<arch>.tar.gz (+ .sha256)  what install.sh / `swarm-kura update` install:
#       the repo's runtime files + tui/dist/swarm-tui[.exe] + template/toolchain/<os>-<arch>
#   swarm-tui-<os>-<arch>.bin (+ .sha256)      the bare TUI binary (install_swarm.sh, branch installs)
#   manifest.json, VERSION

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  toolchain:
    name: gherkin toolchain (all platforms)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Cross-compile every triple
        run: bash scripts/build_toolchain.sh --all
      - uses: actions/upload-artifact@v4
        with:
          name: toolchain
          path: template/toolchain
          if-no-files-found: error

  tui:
    name: tui ${{ matrix.triple }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, triple: linux-x64 }
          - { os: ubuntu-24.04-arm, triple: linux-arm64 }
          - { os: macos-latest, triple: darwin-arm64 }
          - { os: macos-15-intel, triple: darwin-x64 }
          - { os: windows-latest, triple: windows-x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4'
      - name: Build TUI
        working-directory: tui
        shell: bash
        run: |
          bun install
          bun run build
      - name: Stage binary
        shell: bash
        run: |
          mkdir -p out
          if [[ -f tui/dist/swarm-tui.exe ]]; then
            cp tui/dist/swarm-tui.exe "out/swarm-tui-${{ matrix.triple }}.bin"
          else
            cp tui/dist/swarm-tui "out/swarm-tui-${{ matrix.triple }}.bin"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: tui-${{ matrix.triple }}
          path: out/swarm-tui-${{ matrix.triple }}.bin
          if-no-files-found: error

  publish:
    name: bundle + release
    needs: [toolchain, tui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match VERSION
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          if [[ "v$v" != "$GITHUB_REF_NAME" ]]; then
            echo "VERSION is $v but the tag is $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble per-platform bundles
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=tar HEAD | (mkdir -p base && tar -x -C base)
          rm -rf base/tests base/features base/acceptance base/docs/_archive base/.github \
                 base/tui/src base/tui/test base/template/toolchain
          for triple in linux-x64 linux-arm64 darwin-arm64 darwin-x64 windows-x64; do
            bin="artifacts/tui-$triple/swarm-tui-$triple.bin"
            [[ -f "$bin" ]] || { echo "missing TUI for $triple" >&2; exit 1; }
            stage="stage/$triple"
            rm -rf "$stage"; mkdir -p "$stage"
            cp -R base/. "$stage/"
            mkdir -p "$stage/tui/dist" "$stage/template/toolchain"
            exe=""; [[ "$triple" == windows-* ]] && exe=".exe"
            install -m 0755 "$bin" "$stage/tui/dist/swarm-tui$exe"
            cp -R "artifacts/toolchain/$triple" "$stage/template/toolchain/$triple"
            chmod +x "$stage"/template/toolchain/"$triple"/bin/* "$stage/swarm-init" "$stage/bin/swarm-kura" "$stage/install.sh"
            tar -C "$stage" -czf "dist/swarm-kura-$triple.tar.gz" .
            cp "$bin" "dist/swarm-tui-$triple.bin"
          done
          cp VERSION dist/VERSION
          cd dist
          for f in swarm-kura-*.tar.gz swarm-tui-*.bin; do
            sha256sum "$f" > "$f.sha256"
          done

      - name: Build manifest.json
        working-directory: dist
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib
          out = {"version": pathlib.Path("VERSION").read_text().strip(), "bundles": [], "binaries": []}
          for f in sorted(pathlib.Path(".").iterdir()):
              if f.suffix == ".sha256" or f.name in ("manifest.json", "VERSION"):
                  continue
              entry = {"name": f.name, "sha256": hashlib.sha256(f.read_bytes()).hexdigest()}
              out["bundles" if f.name.startswith("swarm-kura-") else "binaries"].append(entry)
          pathlib.Path("manifest.json").write_text(json.dumps(out, indent=2))
          PY
          cat manifest.json

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
